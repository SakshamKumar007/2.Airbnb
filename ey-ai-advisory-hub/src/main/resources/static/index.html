<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EY AI Advisory Hub</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: #202124;
            background: #f6f7f9;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 28px 40px;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 32px;
            letter-spacing: 0;
        }

        header p {
            margin: 0;
            color: #d1d5db;
            font-size: 16px;
            max-width: 760px;
        }

        main {
            width: min(1120px, calc(100% - 32px));
            margin: 28px auto;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 18px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .label {
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
        }

        .value {
            margin-top: 8px;
            font-size: 28px;
            font-weight: 700;
        }

        .section-title {
            margin: 28px 0 12px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #edf0f3;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #f9fafb;
            color: #374151;
            font-size: 13px;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef2ff;
            color: #3730a3;
            font-size: 12px;
            font-weight: 700;
        }

        .links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0 24px;
        }

        a {
            color: #0f766e;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            border-radius: 8px;
            padding: 14px;
        }

        @media (max-width: 760px) {
            header {
                padding: 24px 18px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>EY AI Advisory Hub</h1>
    <p>Spring Boot placement project for tracking public-sector, infrastructure, and Gen AI advisory engagements.</p>
</header>

<main>
    <div class="links">
        <a href="/api/engagements">View JSON API</a>
        <a href="/api/engagements/dashboard">Dashboard JSON</a>
        <a href="/h2-console">H2 Console</a>
    </div>

    <section class="summary" id="summary">
        <div class="card">
            <div class="label">Engagements</div>
            <div class="value" id="totalEngagements">...</div>
        </div>
        <div class="card">
            <div class="label">Investment Crore</div>
            <div class="value" id="totalInvestment">...</div>
        </div>
        <div class="card">
            <div class="label">Average Priority</div>
            <div class="value" id="averagePriority">...</div>
        </div>
    </section>

    <h2 class="section-title">Advisory Engagements</h2>
    <div id="content">Loading project data...</div>
</main>

<script>
    const money = new Intl.NumberFormat("en-IN", {
        maximumFractionDigits: 2
    });

    async function loadDashboard() {
        const [dashboardResponse, engagementsResponse] = await Promise.all([
            fetch("/api/engagements/dashboard"),
            fetch("/api/engagements")
        ]);

        if (!dashboardResponse.ok || !engagementsResponse.ok) {
            throw new Error("API is not responding correctly.");
        }

        const dashboard = await dashboardResponse.json();
        const engagements = await engagementsResponse.json();

        document.getElementById("totalEngagements").textContent = dashboard.totalEngagements;
        document.getElementById("totalInvestment").textContent = money.format(dashboard.totalInvestmentCrore);
        document.getElementById("averagePriority").textContent = dashboard.averagePriorityScore;

        document.getElementById("content").innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Project</th>
                        <th>AI Use Case</th>
                        <th>Status</th>
                        <th>Priority</th>
                    </tr>
                </thead>
                <tbody>
                    ${engagements.map(item => `
                        <tr>
                            <td>${item.clientName}<br><small>${item.sector}</small></td>
                            <td>${item.projectTitle}</td>
                            <td>${item.aiUseCase}</td>
                            <td><span class="status">${item.status}</span></td>
                            <td>${item.priorityScore}</td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    }

    loadDashboard().catch(error => {
        document.getElementById("content").innerHTML = `<div class="error">${error.message}</div>`;
    });
</script>
</body>
</html>
